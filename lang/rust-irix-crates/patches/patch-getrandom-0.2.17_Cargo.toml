$NetBSD$

IRIX 6.5 (mips64-sgi-irix): /dev/urandom, as on AIX; errno from __oserror. Cargo.toml: only the dependencies (and features) IRIX builds use.

--- getrandom-0.2.17/Cargo.toml.orig
+++ getrandom-0.2.17/Cargo.toml
@@ -54,8 +54,6 @@ pre-build = [
 [features]
 custom = []
 js = [
-    "wasm-bindgen",
-    "js-sys",
 ]
 linux_disable_fallback = []
 rdrand = []
@@ -63,7 +61,6 @@ rustc-dep-of-std = [
     "compiler_builtins",
     "core",
     "libc/rustc-dep-of-std",
-    "wasi/rustc-dep-of-std",
 ]
 std = []
 test-in-browser = []
@@ -100,22 +97,6 @@ version = "1.0"
 optional = true
 package = "rustc-std-workspace-core"
 
-[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dependencies.js-sys]
-version = "0.3"
-optional = true
-
-[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dependencies.wasm-bindgen]
-version = "0.2.62"
-optional = true
-default-features = false
-
-[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
-version = "0.3.18"
-
-[target.'cfg(target_os = "wasi")'.dependencies.wasi]
-version = "0.11"
-default-features = false
-
 [target."cfg(unix)".dependencies.libc]
 version = "0.2.154"
 default-features = false
