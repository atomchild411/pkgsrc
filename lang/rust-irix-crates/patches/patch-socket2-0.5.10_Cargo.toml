@@ -86,12 +86,3 @@ path = "src/lib.rs"
 [target."cfg(unix)".dependencies.libc]
 version = "0.2.171"
 
-[target."cfg(windows)".dependencies.windows-sys]
-version = "0.52"
-features = [
-    "Win32_Foundation",
-    "Win32_Networking_WinSock",
-    "Win32_System_IO",
-    "Win32_System_Threading",
-    "Win32_System_WindowsProgramming",
-]
