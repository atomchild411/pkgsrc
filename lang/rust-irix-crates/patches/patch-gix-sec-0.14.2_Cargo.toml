$NetBSD$

IRIX 6.5 (mips64-sgi-irix): uid_t is signed. Cargo.toml: no Windows-only dependencies, so that packages vendoring an older gix-sec 0.14 resolve offline.

--- gix-sec-0.14.2/Cargo.toml.orig
+++ gix-sec-0.14.2/Cargo.toml
@@ -68,19 +68,6 @@
 [target."cfg(not(windows))".dependencies.libc]
 version = "0.2.186"
 
-[target."cfg(windows)".dependencies.gix-path]
-version = "^0.12.3"
-
-[target."cfg(windows)".dependencies.windows-sys]
-version = "0.61.1"
-features = [
-    "Win32_Foundation",
-    "Win32_Security_Authorization",
-    "Win32_Storage_FileSystem",
-    "Win32_System_Memory",
-    "Win32_System_Threading",
-]
-
 [lints.clippy]
 bool_to_int_with_if = "allow"
 borrow_as_ptr = "allow"
